name: Vanguard Wire CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Check for Critical Errors (Undefined Variables, Broken Imports, Syntax Errors)
        run: |
          # Pyflakes analyzes Python programs and detects various errors.
          # It will catch the exact issue that broke ingest.py (ImportError / NameError)
          pyflakes engine/
